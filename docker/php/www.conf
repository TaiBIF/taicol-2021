[www]
user = www-data
group = www-data
listen = 9000

; ── 併發上限：延續當初「限併發」的精神,改由此承擔 ──
; 1.9G RAM,扣掉系統/MySQL/redis/其他約 600M,剩約 1.3G
; 單一 php-fpm 進程約 40-60M → 1300/55 ≈ 20（先保守,上線後用 docker stats 實測 RSS 再微調）
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; 進程處理 500 個請求後回收,避免記憶體長期累積
pm.max_requests = 500

; 讓 fpm 的 log 進 container stdout,方便 docker logs 查看
catch_workers_output = yes