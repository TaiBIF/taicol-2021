global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      # 全站 80 → 443；ACME httpChallenge 不受影響(Traefik 在轉址前先處理 challenge)
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    network: taicol-traefik
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  myresolver:
    acme:
      email: catalogueoflife.taiwan@gmail.com
      storage: /acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO
accessLog: {}