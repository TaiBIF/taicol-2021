services:
  # 開發核心：直接跑 Artisan Serve
  app:
    # 開發用 cli 版本即可，更輕量；image / container / port 可由 .env 覆寫，讓升級用 worktree 與原本的開發環境並存
    # 注意：image 名稱不可用 php:8.2-cli-alpine 這類官方名稱，否則 build 完會蓋掉本機的官方 image，下次 build 時 FROM 會拿到自己 build 過的版本
    image: ${DEV_IMAGE:-taicol-nametool-dev:latest}
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: ${DEV_PREFIX:-taicol-nametool-dev}-app
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    ports:
      - "${DEV_APP_PORT:-8000}:8000" # 將容器的 8000 對應到你電腦的 8000（預設 8000）
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - redis
    networks:
      - taicol-db 
      - internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:alpine
    container_name: ${DEV_PREFIX:-taicol-nametool-dev}-redis
    ports:
      - "${DEV_REDIS_PORT:-6379}:6379"
    networks:
      - internal
  worker:
      image: ${DEV_IMAGE:-taicol-nametool-dev:latest}
      build:
        context: ./docker/php
        dockerfile: Dockerfile
      container_name: ${DEV_PREFIX:-taicol-nametool-dev}-worker
      volumes:
        - .:/var/www/html
      working_dir: /var/www/html
      command: php artisan queue:work --tries=1 --timeout=3700 --max-jobs=50 --max-time=3600 --memory=512
      restart: unless-stopped
      depends_on:
        - redis
      networks:
        - internal
networks:
  # 定義外部網路連結
  taicol-db:
    external: true
    name: taicol-web-2022-1_default
  internal: