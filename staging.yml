networks:
  gateway:
    external: true
  traefik-nametool:
    external: true

services:
  nametool_app:
    build: 
      context: .
      dockerfile: docker/php/Dockerfile-stag
    container_name: taicol-nametool-stag-app
    restart: always
    volumes:
      - .:/var/www/html
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    depends_on:
      - redis
    networks:
      - gateway
      - traefik-nametool
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 128M

  nametool_web:
    image: nginx:alpine
    container_name: taicol-nametool-stag-web
    restart: always
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www/html
    networks:
      - traefik-nametool # 只需要與 Traefik 及內部 App 通訊
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.taicol-web.rule=Host(`staging.taicol.tw`)"
      - "traefik.http.routers.taicol-web.entrypoints=websecure"
      - "traefik.http.routers.taicol-web.tls.certresolver=myresolver"
      - "traefik.http.services.taicol-web.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-nametool"
    deploy:
      resources:
        limits:
          memory: 64M

  redis:
    image: redis:alpine
    container_name: taicol-nametool-stag-redis
    restart: always
    networks:
      - traefik-nametool # 僅需供 app 與 worker 內部連線
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 128M

  worker:
    build: 
      context: .
      dockerfile: docker/php/Dockerfile-stag
    container_name: taicol-nametool-stag-worker
    restart: always
    command: php /var/www/html/artisan queue:work
    volumes:
      - .:/var/www/html
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    networks:
      - gateway
      - traefik-nametool
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 200M